# Pivot Wave 3 dependency fixture plus opt-in app profile.
# Image tags are fixture pins, not GATE-P0-008 verified.
# Redis 不是业务事实源；cache/queue only — not a business fact store.
# Default `docker compose up` starts postgres/minio/qdrant/redis only.
# api, web and worker are profile `app`: `docker compose --profile app up`.
# api and worker inject shared PG/MinIO/Qdrant/Redis vars (not hard-coded).
# api injects PIVOT_INGEST / queues / concurrency / Celery broker (not hard-coded).
# api injects login lockout threshold/window (not hard-coded; both required together).
# api injects Draft Writer PIVOT_LLM* (not hard-coded; worker does not write).
# api and worker inject parser PIVOT_PARSER* (local|native|mineru, not hard-coded).
# worker Celery broker URL is injected, not hard-coded.
# FastAPI composition root:
#   uvicorn pivot.http.main:app --factory
# Worker process:
#   python -m pivot_worker
# CI must not docker compose up or docker build.

name: pivot-deps

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pivot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pivot_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-pivot}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pivot -d pivot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pivot_pg_data:/var/lib/postgresql/data

  minio:
    # MinIO 官方镜像已下架（缺陷 7）；本地 fixture 改用 pgsty/silo 社区 fork，S3 API/环境变量/健康检查不变，仅本地 fixture，不代表正式生产选型。
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pivotminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pivot_dev_only}
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pivot_minio_data:/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "127.0.0.1:6333:6333"
    # D8-03: the qdrant image ships neither wget nor curl (verified by the
    # 2026-11-04 retest: /bin/sh reported "wget: not found"), so the old
    # wget probe could never pass and api/worker (depends_on healthy)
    # could never start. CMD-SHELL runs dash here, which cannot do
    # /dev/tcp redirection, so the probe must invoke bash explicitly and
    # require a 200 status line from GET /readyz (not just a TCP connect).
    # D8-03 follow-up (2026-11-04): a bare $line is interpolated by Compose
    # at parse time ("The \"line\" variable is not set") and renders as the
    # empty string, so `case "" in *200*)` never matched and the container
    # stayed unhealthy anyway. The shell variable must be written $$line;
    # tests/integration/pipeline/test_NFR_OBS_compose_deps.py guards this.
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n' >&3; IFS= read -r line <&3; case \"$$line\" in *200*) exit 0;; *) exit 1;; esac",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pivot_qdrant_data:/qdrant/storage

  redis:
    image: redis:7.4.1
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pivot_redis_data:/data

  api:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    image: pivot-api:0.1.0
    environment:
      PIVOT_TOKEN_SECRET: ${PIVOT_TOKEN_SECRET:?set PIVOT_TOKEN_SECRET}
      PIVOT_ACCESS_TTL: ${PIVOT_ACCESS_TTL:?set PIVOT_ACCESS_TTL}
      PIVOT_REFRESH_TTL: ${PIVOT_REFRESH_TTL:?set PIVOT_REFRESH_TTL}
      PIVOT_EXPORT_TTL: ${PIVOT_EXPORT_TTL:?set PIVOT_EXPORT_TTL}
      PIVOT_DOWNLOAD_TTL: ${PIVOT_DOWNLOAD_TTL:?set PIVOT_DOWNLOAD_TTL}
      PIVOT_EXPORT_PUBLIC_BASE: ${PIVOT_EXPORT_PUBLIC_BASE:?set PIVOT_EXPORT_PUBLIC_BASE}
      PIVOT_RETRIEVAL_K: ${PIVOT_RETRIEVAL_K:?set PIVOT_RETRIEVAL_K}
      # D8-02: the BM25 leg requires these when PIVOT_RETRIEVAL_BACKEND=llama;
      # the example env file already sets them, but api never received them,
      # so the container failed at startup with a RuntimeError.
      PIVOT_BM25_K1: ${PIVOT_BM25_K1:?set PIVOT_BM25_K1}
      PIVOT_BM25_B: ${PIVOT_BM25_B:?set PIVOT_BM25_B}
      PIVOT_STORAGE: ${PIVOT_STORAGE:?set PIVOT_STORAGE}
      PIVOT_DATABASE_URL: ${PIVOT_DATABASE_URL:?set PIVOT_DATABASE_URL}
      PIVOT_OBJECT_STORE: ${PIVOT_OBJECT_STORE:?set PIVOT_OBJECT_STORE}
      PIVOT_MINIO_ENDPOINT: ${PIVOT_MINIO_ENDPOINT:?set PIVOT_MINIO_ENDPOINT}
      PIVOT_MINIO_BUCKET: ${PIVOT_MINIO_BUCKET:?set PIVOT_MINIO_BUCKET}
      PIVOT_MINIO_ACCESS_KEY: ${PIVOT_MINIO_ACCESS_KEY:?set PIVOT_MINIO_ACCESS_KEY}
      PIVOT_MINIO_SECRET_KEY: ${PIVOT_MINIO_SECRET_KEY:?set PIVOT_MINIO_SECRET_KEY}
      PIVOT_INGEST: ${PIVOT_INGEST:?set PIVOT_INGEST}
      PIVOT_PARSE_QUEUE: ${PIVOT_PARSE_QUEUE:?set PIVOT_PARSE_QUEUE}
      PIVOT_ONLINE_QUEUE: ${PIVOT_ONLINE_QUEUE:?set PIVOT_ONLINE_QUEUE}
      PIVOT_WORKER_CONCURRENCY: ${PIVOT_WORKER_CONCURRENCY:?set PIVOT_WORKER_CONCURRENCY}
      PIVOT_CELERY_BROKER: ${PIVOT_CELERY_BROKER:?set PIVOT_CELERY_BROKER}
      PIVOT_VECTOR_STORE: ${PIVOT_VECTOR_STORE:?set PIVOT_VECTOR_STORE}
      PIVOT_QDRANT_ENDPOINT: ${PIVOT_QDRANT_ENDPOINT:-}
      PIVOT_QDRANT_COLLECTION: ${PIVOT_QDRANT_COLLECTION:-}
      PIVOT_QDRANT_VECTOR_SIZE: ${PIVOT_QDRANT_VECTOR_SIZE:-}
      PIVOT_QDRANT_DISTANCE: ${PIVOT_QDRANT_DISTANCE:-}
      PIVOT_QDRANT_ENSURE_COLLECTION: ${PIVOT_QDRANT_ENSURE_COLLECTION:-}
      PIVOT_QDRANT_API_KEY: ${PIVOT_QDRANT_API_KEY:-}
      PIVOT_CACHE_STORE: ${PIVOT_CACHE_STORE:?set PIVOT_CACHE_STORE}
      PIVOT_QUEUE_STORE: ${PIVOT_QUEUE_STORE:?set PIVOT_QUEUE_STORE}
      PIVOT_REDIS_ENDPOINT: ${PIVOT_REDIS_ENDPOINT:-}
      PIVOT_REDIS_PASSWORD: ${PIVOT_REDIS_PASSWORD:-}
      PIVOT_REDIS_DB: ${PIVOT_REDIS_DB:-}
      PIVOT_REDIS_KEY_PREFIX: ${PIVOT_REDIS_KEY_PREFIX:-}
      PIVOT_LOGIN_MAX_FAILURES: ${PIVOT_LOGIN_MAX_FAILURES:?set PIVOT_LOGIN_MAX_FAILURES}
      PIVOT_LOGIN_WINDOW_SECONDS: ${PIVOT_LOGIN_WINDOW_SECONDS:?set PIVOT_LOGIN_WINDOW_SECONDS}
      PIVOT_EMBEDDING: ${PIVOT_EMBEDDING:?set PIVOT_EMBEDDING}
      PIVOT_EMBEDDING_ENDPOINT: ${PIVOT_EMBEDDING_ENDPOINT:-}
      PIVOT_EMBEDDING_MODEL: ${PIVOT_EMBEDDING_MODEL:-}
      PIVOT_EMBEDDING_API_KEY: ${PIVOT_EMBEDDING_API_KEY:-}
      PIVOT_EMBEDDING_TIMEOUT: ${PIVOT_EMBEDDING_TIMEOUT:-}
      PIVOT_LLM: ${PIVOT_LLM:?set PIVOT_LLM}
      PIVOT_LLM_ENDPOINT: ${PIVOT_LLM_ENDPOINT:-}
      PIVOT_LLM_MODEL: ${PIVOT_LLM_MODEL:-}
      PIVOT_LLM_API_KEY: ${PIVOT_LLM_API_KEY:-}
      PIVOT_LLM_TIMEOUT: ${PIVOT_LLM_TIMEOUT:-}
      PIVOT_LLM_AUTH_HEADER: ${PIVOT_LLM_AUTH_HEADER:-}
      PIVOT_LLM_AUTH_SCHEME: ${PIVOT_LLM_AUTH_SCHEME:-}
      PIVOT_LLM_FALLBACK_ENDPOINT: ${PIVOT_LLM_FALLBACK_ENDPOINT:-}
      PIVOT_LLM_FALLBACK_MODEL: ${PIVOT_LLM_FALLBACK_MODEL:-}
      PIVOT_LLM_FALLBACK_API_KEY: ${PIVOT_LLM_FALLBACK_API_KEY:-}
      PIVOT_LLM_FALLBACK_TIMEOUT: ${PIVOT_LLM_FALLBACK_TIMEOUT:-}
      PIVOT_LLM_FALLBACK_AUTH_HEADER: ${PIVOT_LLM_FALLBACK_AUTH_HEADER:-}
      PIVOT_LLM_FALLBACK_AUTH_SCHEME: ${PIVOT_LLM_FALLBACK_AUTH_SCHEME:-}
      PIVOT_PARSER: ${PIVOT_PARSER:?set PIVOT_PARSER}
      PIVOT_PARSER_ENDPOINT: ${PIVOT_PARSER_ENDPOINT:-}
      PIVOT_PARSER_TOKEN: ${PIVOT_PARSER_TOKEN:-}
      PIVOT_PARSER_TIMEOUT: ${PIVOT_PARSER_TIMEOUT:-}
      PIVOT_PARSER_POLL_TIMEOUT: ${PIVOT_PARSER_POLL_TIMEOUT:-}
      PIVOT_PARSER_POLL_INTERVAL: ${PIVOT_PARSER_POLL_INTERVAL:-}
      PIVOT_PARSER_MODEL: ${PIVOT_PARSER_MODEL:-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  web:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile.web
    image: pivot-web:0.1.0
    environment:
      PIVOT_API_ORIGIN: ${PIVOT_API_ORIGIN:?set PIVOT_API_ORIGIN}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  worker:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: pivot-worker:0.1.0
    environment:
      PIVOT_PARSE_QUEUE: ${PIVOT_PARSE_QUEUE:?set PIVOT_PARSE_QUEUE}
      PIVOT_ONLINE_QUEUE: ${PIVOT_ONLINE_QUEUE:?set PIVOT_ONLINE_QUEUE}
      PIVOT_WORKER_CONCURRENCY: ${PIVOT_WORKER_CONCURRENCY:?set PIVOT_WORKER_CONCURRENCY}
      PIVOT_CELERY_BROKER: ${PIVOT_CELERY_BROKER:?set PIVOT_CELERY_BROKER}
      PIVOT_STORAGE: ${PIVOT_STORAGE:?set PIVOT_STORAGE}
      PIVOT_DATABASE_URL: ${PIVOT_DATABASE_URL:?set PIVOT_DATABASE_URL}
      PIVOT_OBJECT_STORE: ${PIVOT_OBJECT_STORE:?set PIVOT_OBJECT_STORE}
      PIVOT_MINIO_ENDPOINT: ${PIVOT_MINIO_ENDPOINT:?set PIVOT_MINIO_ENDPOINT}
      PIVOT_MINIO_BUCKET: ${PIVOT_MINIO_BUCKET:?set PIVOT_MINIO_BUCKET}
      PIVOT_MINIO_ACCESS_KEY: ${PIVOT_MINIO_ACCESS_KEY:?set PIVOT_MINIO_ACCESS_KEY}
      PIVOT_MINIO_SECRET_KEY: ${PIVOT_MINIO_SECRET_KEY:?set PIVOT_MINIO_SECRET_KEY}
      PIVOT_VECTOR_STORE: ${PIVOT_VECTOR_STORE:?set PIVOT_VECTOR_STORE}
      PIVOT_QDRANT_ENDPOINT: ${PIVOT_QDRANT_ENDPOINT:-}
      PIVOT_QDRANT_COLLECTION: ${PIVOT_QDRANT_COLLECTION:-}
      PIVOT_QDRANT_VECTOR_SIZE: ${PIVOT_QDRANT_VECTOR_SIZE:-}
      PIVOT_QDRANT_DISTANCE: ${PIVOT_QDRANT_DISTANCE:-}
      PIVOT_QDRANT_ENSURE_COLLECTION: ${PIVOT_QDRANT_ENSURE_COLLECTION:-}
      PIVOT_QDRANT_API_KEY: ${PIVOT_QDRANT_API_KEY:-}
      PIVOT_CACHE_STORE: ${PIVOT_CACHE_STORE:?set PIVOT_CACHE_STORE}
      PIVOT_QUEUE_STORE: ${PIVOT_QUEUE_STORE:?set PIVOT_QUEUE_STORE}
      PIVOT_REDIS_ENDPOINT: ${PIVOT_REDIS_ENDPOINT:-}
      PIVOT_REDIS_PASSWORD: ${PIVOT_REDIS_PASSWORD:-}
      PIVOT_REDIS_DB: ${PIVOT_REDIS_DB:-}
      PIVOT_REDIS_KEY_PREFIX: ${PIVOT_REDIS_KEY_PREFIX:-}
      PIVOT_EMBEDDING: ${PIVOT_EMBEDDING:?set PIVOT_EMBEDDING}
      PIVOT_EMBEDDING_ENDPOINT: ${PIVOT_EMBEDDING_ENDPOINT:-}
      PIVOT_EMBEDDING_MODEL: ${PIVOT_EMBEDDING_MODEL:-}
      PIVOT_EMBEDDING_API_KEY: ${PIVOT_EMBEDDING_API_KEY:-}
      PIVOT_EMBEDDING_TIMEOUT: ${PIVOT_EMBEDDING_TIMEOUT:-}
      # D8-02: pass the BM25 parameters through to the worker as well, so
      # api and worker render from the same example env file. The worker
      # does not require them (hence :-), unlike the api (hence :?).
      PIVOT_BM25_K1: ${PIVOT_BM25_K1:-}
      PIVOT_BM25_B: ${PIVOT_BM25_B:-}
      PIVOT_PARSER: ${PIVOT_PARSER:?set PIVOT_PARSER}
      PIVOT_PARSER_ENDPOINT: ${PIVOT_PARSER_ENDPOINT:-}
      PIVOT_PARSER_TOKEN: ${PIVOT_PARSER_TOKEN:-}
      PIVOT_PARSER_TIMEOUT: ${PIVOT_PARSER_TIMEOUT:-}
      PIVOT_PARSER_POLL_TIMEOUT: ${PIVOT_PARSER_POLL_TIMEOUT:-}
      PIVOT_PARSER_POLL_INTERVAL: ${PIVOT_PARSER_POLL_INTERVAL:-}
      PIVOT_PARSER_MODEL: ${PIVOT_PARSER_MODEL:-}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz').read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  pivot_pg_data:
  pivot_minio_data:
  pivot_qdrant_data:
  pivot_redis_data:
