# Pivot Wave 3 dependency fixture. Not a production ECS publish stack.
# Image tags are fixture pins, not GATE-P0-008 verified.
# Redis is cache/queue only — not a business fact store.
# api/worker/web are omitted until Dockerfile/Compose app services exist.
# FastAPI composition root (not started by this file):
#   uvicorn pivot.http.main:app --factory
# CI must not docker compose up.

name: pivot-deps

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pivot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pivot_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-pivot}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pivot -d pivot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pivot_pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pivotminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pivot_dev_only}
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pivot_minio_data:/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pivot_qdrant_data:/qdrant/storage

  redis:
    image: redis:7.4.1
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pivot_redis_data:/data

volumes:
  pivot_pg_data:
  pivot_minio_data:
  pivot_qdrant_data:
  pivot_redis_data:
