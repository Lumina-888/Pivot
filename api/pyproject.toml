[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pivot-api"
version = "0.1.0"
description = "Pivot data foundation and persistence contracts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4.0"]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "aiosqlite>=0.20",
]
lint = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../tests/integration/db"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
