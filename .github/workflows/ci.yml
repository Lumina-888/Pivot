# Wave 3 grouped CI. Does not start Compose/uvicorn/Celery and does not verify GATE-P0.
name: ci

on:
  push:
  pull_request:

jobs:
  grouped-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python extras (do not write api/pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./api[test,lint,http]"
          python -m pip install -e "./worker[celery]"
          python -m pip install -r tests/contract/requirements.txt
      - name: Run grouped unit/contract/pipeline checks
        run: python ops/run_grouped_tests.py
