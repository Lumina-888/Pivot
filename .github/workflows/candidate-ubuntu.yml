# Manual technical candidate validation only; no release, Agent, PG or GATE approval.
name: candidate-ubuntu

"on":
  workflow_dispatch:
    inputs:
      confirm_candidate_only:
        description: Candidate validation only; no dependency approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  candidate-validation:
    if: ${{ inputs.confirm_candidate_only == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PIVOT_CANDIDATE_TRIAL: .pi/artifacts/nd-agent-02-c/ubuntu-ci-${{ github.run_id }}-${{ github.run_attempt }}
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          architecture: x64
      - name: Bootstrap an isolated hash-locked driver
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import platform; r=platform.freedesktop_os_release(); assert r["ID"] == "ubuntu" and r["VERSION_ID"] == "24.04"; assert platform.machine() == "x86_64"; assert platform.libc_ver() == ("glibc", "2.39"); assert platform.python_version() == "3.12.10"'
          driver="$RUNNER_TEMP/pivot-candidate-driver"
          test ! -e "$driver"
          python -m venv "$driver"
          "$driver/bin/python" -c 'import importlib.metadata as m; assert m.version("pip") == "25.0.1"'
          "$driver/bin/python" -m pip --isolated --disable-pip-version-check --no-cache-dir install \
            --index-url https://pypi.org/simple --only-binary=:all: --require-hashes --no-deps \
            -r evidence/agent-m03/nd-agent-02-c/ci-bootstrap.lock.txt
      - name: Prepare a fresh native trial and resolve candidate versions
        shell: bash
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/pivot-candidate-driver/bin/python"
          "$py" -B ops/prepare_candidate_ci.py --stage prepare --trial "$PIVOT_CANDIDATE_TRIAL"
          "$py" -B -m pip --isolated --disable-pip-version-check --no-cache-dir install \
            --dry-run --ignore-installed --only-binary=:all: --index-url https://pypi.org/simple \
            -r "$PIVOT_CANDIDATE_TRIAL/roots.txt" -c "$PIVOT_CANDIDATE_TRIAL/versions-only.txt" \
            --report "$PIVOT_CANDIDATE_TRIAL/resolve-report.json" \
            > "$PIVOT_CANDIDATE_TRIAL/resolve.log" 2>&1
          "$py" -B ops/prepare_candidate_ci.py --stage resolved --trial "$PIVOT_CANDIDATE_TRIAL"
      - name: Download and check exact wheel bytes
        shell: bash
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/pivot-candidate-driver/bin/python"
          "$py" -B -m pip --isolated --disable-pip-version-check --no-cache-dir download \
            --index-url https://pypi.org/simple --only-binary=:all: --require-hashes \
            -r "$PIVOT_CANDIDATE_TRIAL/candidate-ci-py312.lock.txt" \
            -d "$PIVOT_CANDIDATE_TRIAL/wheels" > "$PIVOT_CANDIDATE_TRIAL/download.log" 2>&1
          "$py" -B ops/check_candidate_integrity.py \
            --manifest "$PIVOT_CANDIDATE_TRIAL/candidate-manifest.json" --project-root "$PWD" \
            --wheelhouse "$PIVOT_CANDIDATE_TRIAL/wheels" > "$PIVOT_CANDIDATE_TRIAL/integrity.log"
      - name: Rebuild twice offline and run all technical probes
        shell: bash
        run: |
          set -euo pipefail
          trial="$PWD/$PIVOT_CANDIDATE_TRIAL"
          export PIVOT_DEPENDENCY_PROBE_MANIFEST="$trial/candidate-manifest.json"
          export PYTHONPYCACHEPREFIX="$trial/pycache" RUFF_CACHE_DIR="$trial/ruff-cache"
          mkdir "$trial/tmp"
          export TMPDIR="$trial/tmp" TEMP="$trial/tmp" TMP="$trial/tmp"
          for name in verify rebuild; do
            test ! -e "$trial/$name"
            python -m venv "$trial/$name"
            py="$trial/$name/bin/python"
            "$py" -c 'import importlib.metadata as m; assert m.version("pip") == "25.0.1"'
            "$py" -B -m pip --isolated --disable-pip-version-check --no-cache-dir install \
              --no-index --find-links="$trial/wheels" --only-binary=:all: --require-hashes \
              -r "$trial/candidate-ci-py312.lock.txt" > "$trial/$name-install.log" 2>&1
            "$py" -B -m pip check > "$trial/$name-pip-check.log" 2>&1
            "$py" -B -m pytest -q -p no:cacheprovider --basetemp="$trial/$name-pytest" \
              evidence/agent-m03/nd-agent-02-c/test_dependency_probe.py \
              evidence/agent-m03/nd-agent-02-c/test_budget_mapping_probe.py \
              > "$trial/$name-probes.log" 2>&1
          done
      - name: Reject the wrong hash without installing it
        shell: bash
        run: |
          set -euo pipefail
          trial="$PWD/$PIVOT_CANDIDATE_TRIAL"
          if "$trial/verify/bin/python" -B -m pip --isolated --disable-pip-version-check \
            --no-cache-dir install --dry-run --ignore-installed --no-deps --no-index \
            --find-links="$trial/wheels" --only-binary=:all: --require-hashes \
            -r "$trial/wrong-hash.lock.txt" > "$trial/wrong-hash.log" 2>&1; then
            echo "Wrong-hash Fixture was unexpectedly accepted" >&2
            exit 1
          fi
          grep -Fq "THESE PACKAGES DO NOT MATCH THE HASHES" "$trial/wrong-hash.log"
      - name: Run existing Python regression and static checks
        shell: bash
        run: |
          set -euo pipefail
          trial="$PWD/$PIVOT_CANDIDATE_TRIAL"
          export PIVOT_DEPENDENCY_PROBE_MANIFEST="$trial/candidate-manifest.json"
          export PYTHONPYCACHEPREFIX="$trial/pycache" RUFF_CACHE_DIR="$trial/ruff-cache"
          export TMPDIR="$trial/tmp" TEMP="$trial/tmp" TMP="$trial/tmp"
          export PYTEST_ADDOPTS="-p no:cacheprovider --basetemp=$trial/regression-pytest"
          "$trial/verify/bin/python" -B ops/run_grouped_tests.py --skip-web \
            > "$trial/grouped-tests.log" 2>&1
          echo "Candidate technical checks completed; dependency approval remains pending." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve bounded evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PIVOT_CANDIDATE_TRIAL }}/*.json
            ${{ env.PIVOT_CANDIDATE_TRIAL }}/*.log
            ${{ env.PIVOT_CANDIDATE_TRIAL }}/*.txt
          # .pi is hidden; keep the non-recursive file allowlist above.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
