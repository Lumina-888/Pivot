version: '3.8'

services:
  # OpenBao - 开源密钥管理服务
  openbao:
    image: openbao/openbao:2.0.0
    container_name: pivot-openbao
    ports:
      - "8200:8200"
    environment:
      # 开发模式配置（仅用于开发/测试）
      OPENBAO_DEV_ROOT_TOKEN_ID: dev-root-token
      OPENBAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      # 生产模式需要移除 DEV 配置，使用配置文件
      OPENBAO_ADDR: http://0.0.0.0:8200
    cap_add:
      # 允许使用 mlock 防止内存交换到磁盘
      - IPC_LOCK
    volumes:
      - openbao-data:/openbao/file
      - openbao-logs:/openbao/logs
      - ./openbao/config:/openbao/config:ro
    networks:
      - pivot-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  openbao-data:
    driver: local
  openbao-logs:
    driver: local

networks:
  pivot-network:
    driver: bridge
